name: Staging Health

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check API liveness
        run: |
          set -euo pipefail
          body=$(curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            --connect-timeout 10 --max-time 30 \
            https://cash-flow-simulator-staging-api.onrender.com/health)
          test "$body" = '{"status":"ok"}'
      - name: Check API readiness
        run: |
          set -euo pipefail
          body=$(curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            --connect-timeout 10 --max-time 30 \
            https://cash-flow-simulator-staging-api.onrender.com/ready)
          test "$body" = '{"status":"ready"}'
      - name: Check web origin
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            --connect-timeout 10 --max-time 30 \
            https://cash-flow-simulator-staging-web.onrender.com/ > /dev/null
